<svg viewBox="0 0 1800 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="45%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="1800" height="620" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1800" height="620" fill="url(#bg)"/>

    <!-- decorative dot grid top-left -->
    <g fill="#1e3a8a" opacity="0.35">
      <circle cx="90" cy="70" r="4"/><circle cx="120" cy="70" r="4"/><circle cx="150" cy="70" r="4"/><circle cx="180" cy="70" r="4"/><circle cx="210" cy="70" r="4"/>
      <circle cx="90" cy="100" r="4"/><circle cx="120" cy="100" r="4"/><circle cx="150" cy="100" r="4"/><circle cx="180" cy="100" r="4"/><circle cx="210" cy="100" r="4"/>
      <circle cx="90" cy="130" r="4"/><circle cx="120" cy="130" r="4"/><circle cx="150" cy="130" r="4"/><circle cx="180" cy="130" r="4"/><circle cx="210" cy="130" r="4"/>
      <circle cx="90" cy="160" r="4"/><circle cx="120" cy="160" r="4"/><circle cx="150" cy="160" r="4"/><circle cx="180" cy="160" r="4"/><circle cx="210" cy="160" r="4"/>
    </g>

    <!-- decorative dot grid bottom-right -->
    <g fill="#1e40af" opacity="0.3">
      <circle cx="1590" cy="460" r="4"/><circle cx="1620" cy="460" r="4"/><circle cx="1650" cy="460" r="4"/><circle cx="1680" cy="460" r="4"/><circle cx="1710" cy="460" r="4"/>
      <circle cx="1590" cy="490" r="4"/><circle cx="1620" cy="490" r="4"/><circle cx="1650" cy="490" r="4"/><circle cx="1680" cy="490" r="4"/><circle cx="1710" cy="490" r="4"/>
      <circle cx="1590" cy="520" r="4"/><circle cx="1620" cy="520" r="4"/><circle cx="1650" cy="520" r="4"/><circle cx="1680" cy="520" r="4"/><circle cx="1710" cy="520" r="4"/>
      <circle cx="1590" cy="550" r="4"/><circle cx="1620" cy="550" r="4"/><circle cx="1650" cy="550" r="4"/><circle cx="1680" cy="550" r="4"/><circle cx="1710" cy="550" r="4"/>
    </g>

    <!-- code icon top right -->
    <text x="1710" y="130" font-family="Consolas, monospace" font-size="46" font-weight="700" fill="#3b82f6" opacity="0.55" text-anchor="end">&lt;/&gt;</text>

    <!-- side accent lines -->
    <g stroke="#1e40af" stroke-opacity="0.3" stroke-width="4">
      <line x1="90" y1="300" x2="230" y2="300"/>
      <line x1="90" y1="320" x2="200" y2="320"/>
      <line x1="90" y1="340" x2="230" y2="340"/>
    </g>
    <g stroke="#1e40af" stroke-opacity="0.3" stroke-width="4">
      <line x1="1710" y1="290" x2="1570" y2="290"/>
      <line x1="1710" y1="310" x2="1600" y2="310"/>
      <line x1="1710" y1="330" x2="1570" y2="330"/>
    </g>

    <!-- small static code icon divider above the animated text -->
    <text x="900" y="205" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#2563eb" text-anchor="middle" opacity="0.7">&lt;/&gt;</text>

    <!-- ===== Animated sequential text (cycles every 15s) ===== -->

    <text x="900" y="320" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="900" fill="url(#nameGrad)" text-anchor="middle" letter-spacing="4" opacity="0">
      G. SRIKARUN
      <animate attributeName="opacity" dur="12.5s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.012;0.188;0.2;1"
        values="0;1;1;0;0"/>
    </text>

    <text x="900" y="320" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#1e3a8a" text-anchor="middle" opacity="0">
      Fullstack Developer
      <animate attributeName="opacity" dur="12.5s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.2;0.212;0.388;0.4;1"
        values="0;0;1;1;0;0"/>
    </text>

    <text x="900" y="320" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#2563eb" text-anchor="middle" opacity="0">
      DSA Enthusiast
      <animate attributeName="opacity" dur="12.5s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.4;0.412;0.588;0.6;1"
        values="0;0;1;1;0;0"/>
    </text>

    <text x="900" y="320" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" fill="#1e3a8a" text-anchor="middle" opacity="0">
      Data Science Student
      <animate attributeName="opacity" dur="12.5s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.6;0.612;0.788;0.8;1"
        values="0;0;1;1;0;0"/>
    </text>

    <text x="900" y="320" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#1e40af" text-anchor="middle" opacity="0">
      CVR College of Engineering
      <animate attributeName="opacity" dur="12.5s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.8;0.812;0.988;1"
        values="0;0;1;1;0"/>
    </text>

    <!-- ===== end animated text ===== -->

    <!-- bottom waves -->
    <path d="M0,560 C300,610 450,500 750,540 C1050,580 1250,500 1550,540 C1650,555 1750,530 1800,520 L1800,620 L0,620 Z" fill="url(#waveGrad1)"/>
    <path d="M0,590 C350,640 550,560 900,580 C1200,598 1400,555 1800,570 L1800,620 L0,620 Z" fill="url(#waveGrad2)"/>
  </g>
</svg>
